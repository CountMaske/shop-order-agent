spring:
  application:
    name: backend

  # 不要在代码里面写上LLM API，会有泄漏风险
  profiles:
    active: local

# LLM API 配置（阿里云百炼兼容 OpenAI 协议）
# ⚠️ 敏感配置写在 application-local.yaml，不入库
llm:
  api-key: ${LLM_API_KEY:sk-placeholder}  # 从环境变量或 local profile 读取
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen3.8-flash


name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'

jobs:
  build-and-probe:
    # draft 状态下即使事件触发也跳过，只有 ready for review 后才真正跑
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 要求2-①编译打包 + ②SpotBugs（verify 阶段会跑 spotbugs:check）
      - name: Build + SpotBugs(High)
        run: mvn -B clean verify -DskipTests -f backend/pom.xml

      # 要求2-③启动探针：起 jar + curl 状态码，替代测试类
      - name: Startup probe
        run: |
          java -jar backend/target/order-agent-0.0.1-SNAPSHOT.jar > /tmp/app.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/v3/api-docs > /dev/null; then
              echo "Startup probe passed"
              kill $APP_PID 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done
          echo "Startup probe failed"
          cat /tmp/app.log
          kill $APP_PID 2>/dev/null || true
          exit 1
